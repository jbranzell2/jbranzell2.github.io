<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Johan Branzell</title>
    <meta name="description" content="Johan Branzell is a Product Designer based in Stockholm, Sweden. Portfolio of design work including apps, websites, and branding." />
    <meta name="robots" content="index, follow" />
    <script type="text/javascript">
      // Single-page-apps for GitHub Pages: decode the redirect that
      // public/404.html produced, restoring the real URL via
      // history.replaceState before React mounts and reads the route.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
